name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      # The tests use real ffmpeg for extraction, tempo, mastering and MP3 export.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 1

      # Heavy model libraries (torch, transformers, Whisper, Resemblyzer) are
      # imported lazily and are not needed by any unit test.
      - name: Install light test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: scripts
          ALT_TRACK_DUBBING_HOME: ${{ runner.temp }}/runtime
        run: python -m unittest discover -s tests -v
